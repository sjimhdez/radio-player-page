name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  php-syntax:
    name: PHP Syntax (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - "7.4"
          - "8.0"
          - "8.1"
          - "8.2"
          - "8.3"
          - "8.4"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          tools: none

      - name: Lint plugin PHP files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files '*.php')

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No PHP files found."
            exit 0
          fi

          status=0
          for file in "${files[@]}"; do
            if ! php -l "$file"; then
              status=1
            fi
          done
          exit "$status"

  player:
    name: Player (lint, build, dist check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: player/package-lock.json

      - name: Install dependencies
        working-directory: ./player
        run: npm ci

      - name: Run lint
        working-directory: ./player
        run: npm run lint

      - name: Build
        working-directory: ./player
        run: npm run build

      - name: Verify committed dist is up to date
        run: |
          if ! git diff --exit-code -- player/dist/; then
            echo "player/dist is out of date; run npm run build in player/ and commit."
            exit 1
          fi

  gutenberg-blocks:
    name: Gutenberg Blocks (${{ matrix.block-dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        block-dir:
          - blocks/schedule
          - blocks/programs-list
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ${{ matrix.block-dir }}/package-lock.json

      - name: Install dependencies
        working-directory: ./${{ matrix.block-dir }}
        run: npm ci

      - name: Build block
        working-directory: ./${{ matrix.block-dir }}
        run: npm run build

      - name: Verify committed build is up to date
        run: |
          if ! git diff --exit-code -- "${{ matrix.block-dir }}/build/"; then
            echo "${{ matrix.block-dir }}/build is out of date; run npm run build and commit."
            exit 1
          fi

  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          slug: radio-player-page
          exclude-directories: |
            player
            scripts
            .github
          exclude-files: |
            .gitignore
          ignore-codes: |
            WordPress.WP.EnqueuedResources.NonEnqueuedStylesheet
            WordPress.WP.EnqueuedResources.NonEnqueuedScript
          include-experimental: false
