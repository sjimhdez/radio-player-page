name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      plugin-check: ${{ steps.plugin-check.outputs.result }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Filter relevant paths for Plugin Check
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            plugin-check:
              - '**/*.php'
              - 'readme.txt'
              - 'radio-player-page.php'
              - 'uninstall.php'
              - 'admin/**'
              - 'includes/**'
              - 'blocks/**/render.php'
              - 'blocks/**/block.json'
              - '.github/workflows/test.yml'

      - name: Set Plugin Check run flag
        id: plugin-check
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "result=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.filter.outputs.plugin-check }}" == "true" ]; then
            echo "result=true" >> "$GITHUB_OUTPUT"
          else
            echo "result=false" >> "$GITHUB_OUTPUT"
          fi

  php-syntax:
    name: PHP Syntax (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - "7.4"
          - "8.4"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          tools: none

      - name: Lint plugin PHP files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files '*.php')

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No PHP files found."
            exit 0
          fi

          status=0
          for file in "${files[@]}"; do
            if ! php -l "$file"; then
              status=1
            fi
          done
          exit "$status"

  player:
    name: Player (lint, build, dist check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: player/package-lock.json

      - name: Install dependencies
        working-directory: ./player
        run: npm ci

      - name: Run lint
        working-directory: ./player
        run: npm run lint

      - name: Build
        working-directory: ./player
        run: npm run build

      - name: Verify committed dist is up to date
        run: |
          if ! git diff --exit-code -- player/dist/; then
            echo "player/dist is out of date; run npm run build in player/ and commit."
            exit 1
          fi

  gutenberg-blocks:
    name: WordPress blocks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build and verify blocks
        shell: bash
        run: |
          set -euo pipefail

          for block_dir in blocks/schedule blocks/programs-list; do
            echo "Building ${block_dir}..."
            (cd "$block_dir" && npm ci && npm run build)

            if ! git diff --exit-code -- "${block_dir}/build/"; then
              echo "${block_dir}/build is out of date; run npm run build and commit."
              exit 1
            fi
          done

  plugin-check:
    name: Plugin Check
    needs: changes
    if: needs.changes.outputs.plugin-check == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Workaround for wordpress/plugin-check-action#579 and WordPress/gutenberg#78762:
      # plugin-check-action embeds plugin-check.zip in .wp-env.json; on Node 24.16+ wp-env
      # can exit 0 without starting Docker. Install Plugin Check via WP-CLI after boot.
      # Revert to wordpress/plugin-check-action@v1 once upstream is fixed.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configure wp-env
        run: |
          cat > .wp-env.json <<'EOF'
          {
            "core": null,
            "port": 8880,
            "testsEnvironment": false,
            "plugins": [],
            "mappings": {
              "wp-content/plugins/radio-player-page": "."
            }
          }
          EOF
          npm install -g @wordpress/env

      - name: Start wp-env
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 10
          command: wp-env start --update

      - name: Verify wp-env is running
        run: wp-env run cli wp cli info

      - name: Run Plugin Check
        run: |
          wp-env run cli wp plugin install plugin-check --activate
          wp-env run cli wp plugin activate radio-player-page
          wp-env run cli wp plugin check radio-player-page \
            --slug=radio-player-page \
            --exclude-directories=player,scripts,.github \
            --exclude-files=.gitignore,.wp-env.json \
            --ignore-codes=WordPress.WP.EnqueuedResources.NonEnqueuedStylesheet,WordPress.WP.EnqueuedResources.NonEnqueuedScript \
            --require=./wp-content/plugins/plugin-check/cli.php
