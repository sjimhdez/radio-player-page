name: Plugin Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  # WordPress Plugin Check
  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: "./"
          slug: "radio-player-page"
          exclude-directories: "player,scripts,.github"
          ignore-codes: |
            WordPress.WP.EnqueuedResources.NonEnqueuedStylesheet
            WordPress.WP.EnqueuedResources.NonEnqueuedScript
          exclude-files: |
            .gitignore
  build-player:
    name: Build React Player
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: player/package-lock.json

      - name: Install dependencies
        working-directory: ./player
        run: npm ci

      - name: Build
        working-directory: ./player
        run: npm run build

  lint-player:
    name: Lint React Player
    runs-on: ubuntu-latest
    needs: build-player
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: player/package-lock.json

      - name: Install dependencies
        working-directory: ./player
        run: npm ci

      - name: Run lint
        working-directory: ./player
        run: npx eslint .

  build-gutenberg-blocks:
    name: Build Gutenberg Blocks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        block-dir:
          - blocks/schedule
          - blocks/programs-list
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ${{ matrix.block-dir }}/package-lock.json

      - name: Install dependencies
        working-directory: ./${{ matrix.block-dir }}
        run: npm ci

      - name: Build block
        working-directory: ./${{ matrix.block-dir }}
        run: npm run build

  php-syntax:
    name: PHP Syntax (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - "5.6"
          - "7.0"
          - "7.1"
          - "7.2"
          - "7.3"
          - "7.4"
          - "8.0"
          - "8.1"
          - "8.2"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          tools: none

      - name: Lint plugin PHP files
        shell: bash
        run: |
          set -euo pipefail
          files=$(git ls-files '*.php')

          if [ -z "$files" ]; then
            echo "No PHP files found."
            exit 0
          fi

          echo "$files" | while IFS= read -r file; do
            php -l "$file"
          done
